<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางเวร/ภารกิจ งานสอบสวน สน.ลำหิน</title>
    <link rel="icon" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=40">
</head>
<body>
    <div class="page">

        <!-- ===== แถบหัวเรื่อง ===== -->
        <header class="hero">
            <img src="logo.png" alt="ตราสถานีตำรวจนครบาลลำหิน" class="hero-logo">
            <div class="hero-txt">
                <h1>ตารางเวร / ภารกิจ งานสอบสวน</h1>
                <span>สถานีตำรวจนครบาลลำหิน</span>
            </div>
            <div class="hero-right">
                <div class="hero-clock" id="clock">--:--</div>
                <div class="hero-date" id="clockDate">-</div>
            </div>
        </header>

        <!-- ===== ค้นหา ===== -->
        <section class="search-bar">
            <div class="search-field">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input id="q" type="search" list="peopleList" autocomplete="off"
                       placeholder="ค้นหาชื่อ หรือ ภารกิจ…">
                <datalist id="peopleList"></datalist>
            </div>
            <div class="search-field search-date">
                <i class="fa-regular fa-calendar"></i>
                <input id="dateInput" type="date" title="เลือกวันที่">
            </div>
            <button id="todayBtn" class="btn-today" type="button"><i class="fa-solid fa-rotate-left"></i> วันนี้</button>
        </section>

        <!-- ===== ผลการค้นหา (แสดงเมื่อค้นหา) ===== -->
        <section class="card results" id="results" hidden>
            <div class="card-h">
                <i class="fa-solid fa-list-check"></i>
                <span id="resultsTitle">ผลการค้นหา</span>
                <button class="chip-btn" id="pastToggle" type="button">แสดงย้อนหลัง</button>
                <button class="icon-x" id="closeResults" type="button" title="ปิด"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="resultsList" class="res-list"></div>
        </section>

        <!-- ===== วันที่กำลังดู ===== -->
        <div class="day-banner" id="dayBanner"></div>

        <main class="day-grid">
            <!-- เวร -->
            <section class="card duty-card">
                <div class="card-h">
                    <i class="fa-solid fa-user-shield"></i>
                    <span id="dutyTitle">เวรสอบสวน</span>
                    <span class="card-sub" id="dutySub"></span>
                </div>
                <div id="duty" class="duty-body"><div class="loading"><span class="spin"></span> กำลังโหลด…</div></div>
            </section>

            <!-- ภารกิจ -->
            <section class="card mission-card">
                <div class="card-h">
                    <i class="fa-solid fa-clipboard-list"></i>
                    <span id="missionTitle">ภารกิจ</span>
                    <span class="card-sub" id="missionSub"></span>
                </div>
                <div id="missions" class="mis-body"><div class="loading"><span class="spin"></span> กำลังโหลด…</div></div>
            </section>
        </main>

        <!-- ===== ปฏิทิน ===== -->
        <section class="card cal-card">
            <div class="cal-head">
                <button id="prevMonth" class="icon-btn" type="button" title="เดือนก่อน"><i class="fa-solid fa-chevron-left"></i></button>
                <h3 id="monthLabel">-</h3>
                <button id="nextMonth" class="icon-btn" type="button" title="เดือนถัดไป"><i class="fa-solid fa-chevron-right"></i></button>
            </div>
            <div class="cal-week">
                <div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div>
            </div>
            <div id="calDays" class="cal-days"></div>
            <div class="cal-legend" id="calLegend">
                <span><i class="dot dot-today"></i>วันนี้</span>
                <span><i class="dot dot-duty"></i>มีเวร</span>
                <span><i class="dot dot-mis"></i>มีภารกิจ</span>
                <span id="legendPerson" hidden><i class="dot dot-person"></i>วันที่คนที่ค้นหาเข้าเวร/ภารกิจ</span>
            </div>
        </section>

        <footer class="foot">ข้อมูลจากระบบงานสอบสวน สน.ลำหิน · อัปเดตอัตโนมัติทุก 5 นาที · <span id="lastSync">-</span></footer>
    </div>

    <script src="app.js?v=40"></script>
</body>
</html>
